server:
  port: 8081

spring:
  application:
    name: mcpclient

  devtools:
    restart:
      enabled: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
    mcp:
      client:
        enabled: true
        type: SYNC
        request-timeout: 60s
        stdio:
          servers-configuration: classpath:mcp-servers.json


    model:
      embedding: openai






logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG

